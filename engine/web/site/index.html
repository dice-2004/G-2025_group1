<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G2 五目並べ</title>
<meta name="g2-build" content="__BUILD__">
<meta name="description" content="探索とパターン評価で作った五目並べ AI「G2」とブラウザで対局できます。">
<style>
  :root {
    --bg: #f6f3ec; --panel: #ffffff; --text: #1f1d1a; --muted: #6b665d; --line: #e3ddd0;
    --accent: #b5542c; --board: #dcb46c; --grid: #5a4320; --btn: #f1ece1; --btn-hover: #e7e0d1;
    --danger: #c0392b; --ok: #2e7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161a; --panel: #222126; --text: #ece9e3; --muted: #a29d94; --line: #34323a;
      --accent: #e0835a; --board: #c9a35e; --grid: #4a3618; --btn: #2d2b31; --btn-hover: #38363d;
      --danger: #ff6b5b; --ok: #5cc48a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17161a; --panel: #222126; --text: #ece9e3; --muted: #a29d94; --line: #34323a;
    --accent: #e0835a; --board: #c9a35e; --grid: #4a3618; --btn: #2d2b31; --btn-hover: #38363d;
    --danger: #ff6b5b; --ok: #5cc48a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 40px; }
  header h1 { margin: 0; font-size: 1.5rem; letter-spacing: .02em; }
  header p { margin: 4px 0 16px; color: var(--muted); font-size: .9rem; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .board-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  canvas { display: block; width: 100%; height: auto; touch-action: manipulation; cursor: pointer; border-radius: 6px; }
  canvas.busy { cursor: progress; }
  .side { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card h2 { margin: 0 0 10px; font-size: .95rem; }
  .status { font-size: 1.05rem; font-weight: 600; min-height: 1.6em; }
  .status.win { color: var(--ok); } .status.lose { color: var(--danger); }
  .info { color: var(--muted); font-size: .85rem; min-height: 1.3em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  label.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0; font-size: .9rem; }
  label.row > span { white-space: nowrap; }
  label.row select { min-width: 0; max-width: 64%; }
  select { font: inherit; font-size: .9rem; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--btn); color: var(--text); }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button {
    font: inherit; font-size: .9rem; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--btn); color: var(--text); cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--btn-hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .note { color: var(--muted); font-size: .8rem; margin: 0; }
  .note a { color: var(--accent); }
  .moves { font-size: .8rem; color: var(--muted); max-height: 7.5em; overflow-y: auto; word-break: break-all; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <header>
    <h1>G2 五目並べ</h1>
    <p>探索（αβ・脅威探索・df-pn の詰み探索）とパターン評価で作った五目並べ AI「G2」と対局できます。AI はこの端末のブラウザの中で動きます。</p>
  </header>
  <div class="layout">
    <div class="board-wrap"><canvas id="board" width="720" height="720" aria-label="碁盤"></canvas></div>
    <div class="side">
      <div class="card">
        <div class="status" id="status">読み込み中…</div>
        <div class="info" id="info"></div>
      </div>
      <div class="card">
        <h2>対局の設定</h2>
        <label class="row"><span>ルール</span>
          <select id="rule">
            <option value="4">連珠（黒に禁じ手）</option>
            <option value="0">自由（五以上で勝ち）</option>
            <option value="1">ちょうど五（長連は勝ちでない）</option>
          </select>
        </label>
        <label class="row"><span>あなたの石</span>
          <select id="human">
            <option value="1">黒（先手）</option>
            <option value="2">白（後手）</option>
          </select>
        </label>
        <label class="row"><span>AI の思考時間</span>
          <select id="time">
            <option value="500">0.5 秒</option>
            <option value="1000" selected>1 秒</option>
            <option value="2000">2 秒</option>
            <option value="5000">5 秒</option>
          </select>
        </label>
        <label class="row"><span>手順の番号</span>
          <select id="numbers">
            <option value="0">表示しない</option>
            <option value="1">表示する</option>
          </select>
        </label>
        <div class="buttons">
          <button class="primary" id="newgame">新しい対局</button>
          <button id="undo">待った</button>
        </div>
        <p class="note" style="margin-top:10px">設定は「新しい対局」で反映されます（思考時間と手順の番号はすぐ反映）。</p>
      </div>
      <div class="card">
        <h2>手順</h2>
        <div class="moves" id="moves">—</div>
      </div>
      <p class="note">連珠では黒の三三・四四・長連が禁じ手です。あなたが黒番のとき、禁じ手の点に × を表示します。
        ビルド <span id="build"></span>。ソースは <a href="https://github.com/dice-2004/G-2025_group1/tree/claude/dev/engine" target="_blank" rel="noopener">GitHub</a>。</p>
    </div>
  </div>
</main>
<script src="app.js?v=__BUILD__"></script>
</body>
</html>
